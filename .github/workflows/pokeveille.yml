name: PokeVeille

on:
  schedule:
    - cron: '*/5 * * * *'    # toutes les 5 min (minimum GitHub ; il peut retarder de quelques minutes)
  workflow_dispatch:
    inputs:
      test:
        description: 'Envoyer une notification de test'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pokeveille
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    env:
      TZ: Europe/Paris
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      TABLEAU_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      # magasins.json (magasins proches) est mis a jour chaque semaine par le workflow "Magasins proches"
      - uses: actions/checkout@v4

      - name: Restaurer l'etat precedent (evite les alertes en double)
        uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: etat-${{ github.run_id }}
          restore-keys: etat-

      - name: Notification de test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
        run: pwsh -NoProfile -File server.ps1 -TestNotification

      - name: Analyse des stocks
        run: |
          pwsh -NoProfile -File server.ps1 -Once -Export site/etat.json
          cp web/index.html site/index.html
          touch site/.nojekyll
          echo "### Dernieres lignes du journal" >> "$GITHUB_STEP_SUMMARY"
          tail -n 6 data/journal.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Sauver l'etat
        if: ${{ always() && hashFiles('data/state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/state.json
          key: etat-${{ github.run_id }}

      # Page consultable depuis le telephone (GitHub Pages)
      - name: Preparer la page
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publier la page
        id: deploiement
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # Un petit commit par jour : GitHub desactive les taches planifiees des depots sans activite depuis 60 jours.
      - name: Battement quotidien
        continue-on-error: true
        run: |
          today=$(date -u +%F)
          git fetch -q origin main
          if [ "$(git show origin/main:battement.txt 2>/dev/null)" != "$today" ]; then
            git checkout -q -B main origin/main
            echo "$today" > battement.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add battement.txt
            git commit -q -m "Battement quotidien $today"
            git push -q origin main
          fi

name: PokeVeille

on:
  schedule:
    - cron: '*/10 * * * *'   # toutes les 10 min (GitHub peut retarder de quelques minutes)
  workflow_dispatch:
    inputs:
      test:
        description: 'Envoyer une notification de test'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pokeveille
  cancel-in-progress: false

jobs:
  analyse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Restaurer l'etat precedent (evite les alertes en double)
        uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: etat-${{ github.run_id }}
          restore-keys: etat-

      - name: Notification de test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: pwsh -NoProfile -File server.ps1 -TestNotification

      - name: Analyse des stocks
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          pwsh -NoProfile -File server.ps1 -Once
          echo "### Dernieres lignes du journal" >> "$GITHUB_STEP_SUMMARY"
          tail -n 6 data/journal.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Sauver l'etat
        if: ${{ always() && hashFiles('data/state.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/state.json
          key: etat-${{ github.run_id }}

      # Un petit commit par jour : GitHub desactive les taches planifiees des depots sans activite depuis 60 jours.
      - name: Battement quotidien
        run: |
          date -u +%F > battement.txt
          if [ -n "$(git status --porcelain battement.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add battement.txt
            git commit -m "Battement quotidien $(date -u +%F)"
            git push
          fi
